<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - CampusEats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div>
        <div class="brand-header">
          <div class="logo-container">
            <div class="logo-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4a8 8 0 0 0-8 8v1h16v-1a8 8 0 0 0-8-8z"></path><path d="M4 17h16"></path><circle cx="12" cy="4" r="1.5" fill="currentColor"></circle></svg>
            </div>
            <div>
              <div class="brand-title">Campus<span>Eats</span></div>
              <div class="brand-tagline">Good Food. Better Days.</div>
            </div>
          </div>
        </div>

        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>Home</span></a>
          <a href="menu.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg><span>Menu</span></a>
          <a href="wishlist.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span>Wishlist</span></a>
          <a href="cart.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2L3 6v14a2 2 0 0 1-2 2h14a2 2 0 0 1 2-2V6l-3-4z"></path></svg><span>Cart</span><span class="badge-count">2</span></a>
          <a href="orders.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line></svg><span>My Orders</span></a>
          <a href="tracking.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"></path></svg><span>Track Order</span></a>
          <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path></svg><span>Profile</span></a>
        </nav>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <h2 style="font-size: 18px; font-weight: 800;">Your Cart</h2>
        <div class="navbar-right">
          <a href="profile.html" class="user-profile-btn">
            <div class="user-avatar">GV</div>
            <div class="user-info"><span class="user-name">User</span></div>
          </a>
        </div>
      </header>

      <main class="content-area">
        <div class="cart-layout">
          
          <!-- CART ITEMS -->
          <div class="cart-items-card">
            <div class="cart-table-header">
              <span>Item</span>
              <span>Quantity</span>
              <span>Subtotal</span>
              <span></span>
            </div>
            <div id="cartItemsList"></div>
          </div>

          <!-- SUMMARY & CHECKOUT -->
          <div class="order-summary-card">
            <h3 class="summary-title">Order Summary</h3>

            <div class="promo-box">
              <input type="text" id="promoCodeInput" class="promo-input" placeholder="Promo code (e.g. CAMPUS25)">
              <button id="applyPromoBtn" class="apply-promo-btn">Apply</button>
            </div>

            <div class="summary-row">
              <span>Subtotal</span>
              <span id="subtotalVal">₹0</span>
            </div>
            <div id="discountRow" class="summary-row" style="display: none; color: #16A34A; font-weight: 700;">
              <span>Promo Discount (25%)</span>
              <span id="discountVal">-₹0</span>
            </div>
            <div class="summary-row">
              <span>Campus Delivery</span>
              <span id="deliveryVal">FREE</span>
            </div>
            <div class="summary-row">
              <span>Taxes & Packaging</span>
              <span id="taxesVal">₹18</span>
            </div>

            <div class="summary-row total">
              <span>Total Amount</span>
              <span id="totalVal">₹0</span>
            </div>

            <button id="checkoutBtn" class="checkout-btn">Place Campus Order →</button>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
