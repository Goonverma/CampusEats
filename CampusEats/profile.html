<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile - CampusEats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div>
        <div class="brand-header">
          <div class="logo-container">
            <div class="logo-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4a8 8 0 0 0-8 8v1h16v-1a8 8 0 0 0-8-8z"></path><path d="M4 17h16"></path><circle cx="12" cy="4" r="1.5" fill="currentColor"></circle></svg>
            </div>
            <div>
              <div class="brand-title">Campus<span>Eats</span></div>
              <div class="brand-tagline">Good Food. Better Days.</div>
            </div>
          </div>
        </div>

        <nav class="nav-menu">
          <a href="dashboard.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>Home</span></a>
          <a href="menu.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg><span>Menu</span></a>
          <a href="wishlist.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span>Wishlist</span></a>
          <a href="cart.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2L3 6v14a2 2 0 0 1-2 2h14a2 2 0 0 1 2-2V6l-3-4z"></path></svg><span>Cart</span><span class="badge-count">2</span></a>
          <a href="orders.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line></svg><span>My Orders</span></a>
          <a href="tracking.html" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"></path></svg><span>Track Order</span></a>
          <a href="profile.html" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path></svg><span>Profile</span></a>
        </nav>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-navbar">
        <h2 style="font-size: 18px; font-weight: 800;">Student Profile Settings</h2>
        <div class="navbar-right">
          <a href="profile.html" class="user-profile-btn">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Goon Verma" class="user-avatar">
            <div class="user-info"><span class="user-name">Goon Verma</span></div>
          </a>
        </div>
      </header>

      <main class="content-area">
        <div class="profile-card" style="max-width: 800px;">
          <div class="profile-header-banner">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Goon Verma" class="large-avatar">
            <div class="profile-title-group">
              <h1 class="profile-name">Goon Verma</h1>
              <div class="profile-meta">Computer Science Student • Roll #2024CS1082</div>
              <div class="points-badge">
                🪙 420 CampusPoints Available
              </div>
            </div>
          </div>

          <form id="profileForm" style="display: flex; flex-direction: column; gap: 16px;">
            <div class="profile-form-grid">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="profName" class="form-input" style="padding-left: 14px;" value="Goon Verma" required>
              </div>

              <div class="form-group">
                <label class="form-label">Student Email</label>
                <input type="email" id="profEmail" class="form-input" style="padding-left: 14px;" value="goon.verma@campus.edu" required>
              </div>

              <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="profPhone" class="form-input" style="padding-left: 14px;" value="+91 98765 43210" required>
              </div>

              <div class="form-group">
                <label class="form-label">Default Hostel & Room</label>
                <input type="text" id="profHostel" class="form-input" style="padding-left: 14px;" value="Hostel 4, Room 208, North Campus" required>
              </div>
            </div>

            <button type="submit" class="save-profile-btn">Save Profile Changes</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
